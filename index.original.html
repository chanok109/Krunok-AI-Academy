<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AIra Learning Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: แถบนำทางบนติดขอบ + Sidebar ซ้ายบนเดสก์ท็อป / แถบล่างบนมือถือ, พื้นอวกาศกลางคืนพร้อมการ์ดกระจก */
:root{
  --navy:#0B1026; --deep:#161336; --lavender:#9B87F5; --cyan:#57CCF2; --neon:#00E5FF; --gold:#FFD66D; --pearl:#F4F6FB;
  --bg:var(--navy);
  --fg:var(--pearl);
  --muted:#A9AEC9;
  --dim:#8A8FB0;
  --glass:rgba(32,28,78,.48);
  --glass-strong:rgba(28,24,70,.78);
  --line:rgba(155,135,245,.22);
  --line-strong:rgba(87,204,242,.45);
  --ok:#5BE3A8; --warn:var(--gold); --err:#FF7A90;
  --grad:linear-gradient(120deg,var(--lavender),var(--cyan) 60%,var(--neon));
  --font:"Prompt","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --nav-h:64px; --side-w:256px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(900px 520px at 85% -10%,rgba(155,135,245,.28),transparent 60%),
   radial-gradient(700px 480px at -10% 30%,rgba(0,229,255,.12),transparent 60%),
   radial-gradient(800px 600px at 50% 120%,rgba(22,19,54,1),transparent 70%),
   linear-gradient(180deg,var(--navy),var(--deep));}
.cosmos::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(87,204,242,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(87,204,242,.06) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%)}
#root{position:relative;z-index:1}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--cyan)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);letter-spacing:.02em}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Navbar ---------- */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--nav-h);
  display:flex;align-items:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(11,16,38,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);background:none;border:0;cursor:pointer;padding:4px}
.brand-mark{width:38px;height:38px}
.brand-name{font-weight:700;font-size:17px;letter-spacing:.01em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-spacer{flex:1}
.nav-progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.user-chip .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--navy);background:var(--grad)}
.user-name{font-size:13px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:calc(100vh - var(--nav-h))}
.sidebar{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--nav-h) - env(safe-area-inset-top,0px));
  padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);overflow-y:auto}
.side-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:10px 12px 4px}
.side-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-sm);border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.side-link:hover{background:rgba(155,135,245,.10);color:var(--fg)}
.side-link[aria-current="page"]{background:linear-gradient(90deg,rgba(155,135,245,.22),rgba(87,204,242,.08));color:var(--fg);border-color:var(--line)}
.side-link .lbl{flex:1;min-width:0}
.side-link .lbl small{display:block;font-size:12px;color:var(--dim);line-height:1.3}
.side-num{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:rgba(11,16,38,.5)}
.side-link[aria-current="page"] .side-num{border-color:var(--cyan);color:var(--neon);box-shadow:0 0 14px rgba(0,229,255,.35)}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.main{min-width:0;display:flex;flex-direction:column}
.content{flex:1;width:100%;max-width:1120px;margin:0 auto;padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
@media (min-width:960px){.content{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* ---------- Mobile nav ---------- */
.mobile-nav{display:none}
@media (max-width:959px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .nav-progress .np-text{display:none}
  .mobile-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
    background:rgba(11,16,38,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .mobile-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--dim);font-size:11px;border-radius:10px;cursor:pointer}
  .mobile-nav button[aria-current="page"]{color:var(--neon);background:rgba(0,229,255,.08)}
  .main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){.user-name,.brand-sub{display:none}}
.btn.mobile-only-logout{display:none}
@media (max-width:959px){.btn.mobile-only-logout{display:inline-flex}}

/* ---------- Glass & UI primitives ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px -24px rgba(0,0,0,.7)}
.glass.pad{padding:24px}
@media (max-width:520px){.glass.pad{padding:18px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--grad);color:var(--navy);box-shadow:0 8px 26px -10px rgba(0,229,255,.7)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 30px -10px rgba(0,229,255,.9)}
.btn-ghost{background:rgba(155,135,245,.08);border-color:var(--line);color:var(--fg)}
.btn-ghost:hover:not(:disabled){border-color:var(--line-strong);background:rgba(87,204,242,.1)}
.btn-danger{background:rgba(255,122,144,.12);border-color:rgba(255,122,144,.45);color:#FFC2CC}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.icon-btn:hover{border-color:var(--line-strong)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:rgba(11,16,38,.45);color:var(--muted);white-space:nowrap}
.badge.demo{border-color:rgba(255,214,109,.5);color:var(--gold);background:rgba(255,214,109,.08)}
.badge.ok{border-color:rgba(91,227,168,.5);color:var(--ok)}
.badge.cyan{border-color:var(--line-strong);color:var(--cyan)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:500}
.lead{color:var(--muted);max-width:62ch}
.progress-bar{height:8px;border-radius:999px;background:rgba(155,135,245,.14);overflow:hidden}
.progress-bar>span{display:block;height:100%;border-radius:inherit;background:var(--grad);box-shadow:0 0 12px rgba(0,229,255,.6);transition:width .6s ease}
.ring-label{font-family:var(--mono);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.input{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(11,16,38,.6);color:var(--fg);font:inherit;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(87,204,242,.2)}
.input[aria-invalid="true"]{border-color:var(--err)}
.field-err{font-size:12.5px;color:var(--err)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat}
select.input option{background:var(--deep)}

/* ---------- Page header ---------- */
.page-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.page-head h1{font-size:clamp(26px,4vw,38px);font-weight:700}
.page-head .head-text{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 380px}

/* ---------- Home / Dashboard (Prompt 02) ---------- */
.hero-meta{display:flex;flex-wrap:wrap;gap:8px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.section-title h2{font-size:21px;font-weight:600}
.btn-inline{display:flex;gap:10px;flex-wrap:wrap}
.welcome{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:12px 28px;align-items:end;padding:30px 30px 0}
.welcome::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(155,135,245,.75),rgba(0,229,255,.3),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.welcome::after{content:"";position:absolute;right:-90px;top:-140px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.16),transparent 65%);pointer-events:none}
.welcome-text{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;min-width:0;padding-bottom:30px}
.welcome h1{font-size:clamp(28px,4.4vw,44px);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.welcome-th{font-size:clamp(16px,2vw,19px);font-weight:500}
.welcome-aira{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;align-self:stretch}
.speech{position:relative;padding:12px 16px;border-radius:16px;background:var(--pearl);color:var(--navy);font-size:14px;line-height:1.55;box-shadow:0 10px 30px -12px rgba(0,229,255,.55);max-width:300px;animation:toastIn .5s ease both}
.speech::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.speech-name{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5B47C9}
.welcome-bot{width:170px;margin-bottom:-28px}
@media (max-width:760px){
  .welcome{grid-template-columns:1fr;padding:22px 18px 0}
  .welcome-text{padding-bottom:4px}
  .welcome-aira{flex-direction:row;align-items:flex-end;justify-content:flex-start}
  .welcome-bot{width:104px;flex:none;margin-bottom:-16px}
  .speech{flex:1;min-width:0;margin-bottom:22px}
  .speech::after{left:auto;right:-6px;bottom:22px;transform:rotate(45deg)}
}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.stats4{grid-template-columns:1fr}}
.stat{display:flex;align-items:center;gap:14px;padding:18px}
.stat-ic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;background:rgba(87,204,242,.1);color:var(--cyan);border:1px solid var(--line)}
.stat-num{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-num small{font-size:15px;color:var(--dim);font-weight:500}
.stat-lbl{font-size:13px;color:var(--muted)}
.stat-sub{font-size:12px;color:var(--dim);line-height:1.4}
.stat-empty{font-size:15px;font-weight:600;line-height:1.3}
.ucards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.ucards{grid-template-columns:1fr}}
.ucard{display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.ucard:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:0 22px 50px -24px rgba(0,229,255,.45)}
.ucard-art{position:relative;aspect-ratio:16/9;max-width:100%;border-bottom:1px solid var(--line);background:radial-gradient(70% 90% at 50% 50%,rgba(155,135,245,.18),transparent 70%),linear-gradient(160deg,var(--deep),var(--navy))}
.ucard-art .unit-art{width:100%;height:100%;display:block}
.ucard-no{position:absolute;left:14px;top:12px;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.14em;padding:4px 10px;border-radius:8px;background:rgba(11,16,38,.75);border:1px solid var(--line);color:var(--neon)}
.ucard-status{position:absolute;right:12px;top:12px}
.ucard-body{display:flex;flex-direction:column;gap:10px;padding:20px 22px 22px;flex:1}
.ucard-en{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.ucard h3{font-size:19px;font-weight:600}
.ucard p{font-size:14px;color:var(--muted)}
.ucard-progress{display:flex;align-items:center;gap:12px}
.ucard-body .ucard-progress{margin-top:auto;padding-top:6px}
.ucard-progress .progress-bar{flex:1}
.ucard-progress .mono{font-size:13px;min-width:3.2em;text-align:right}
.ucard-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--dim)}
.ucard-meta span{display:inline-flex;align-items:center;gap:6px}
.ucard-body .btn{align-self:flex-start;margin-top:4px}
.home-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.home-split{grid-template-columns:1fr}}
.continue,.overview{display:grid;gap:16px;align-content:start}
.continue-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:520px){.continue-row{grid-template-columns:1fr}}
.continue-art{aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,var(--deep),var(--navy))}
.continue-art .unit-art{width:100%;height:100%;display:block}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.facts>div{padding:12px 14px;border-radius:12px;background:rgba(11,16,38,.45);border:1px solid var(--line);min-width:0}
.facts>div.wide{grid-column:1/-1}
.facts dt{font-size:12px;color:var(--dim)}
.facts dd{margin:0;font-weight:600;font-size:15px}
#my-progress{display:grid;gap:16px;outline:none;scroll-margin-top:calc(var(--nav-h) + 16px + env(safe-area-inset-top,0px))}
.mp-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:1000px){.mp-grid{grid-template-columns:1fr}}
.mp-list{display:flex;flex-direction:column;gap:18px}
.mp-row{display:flex;gap:14px;align-items:flex-start}
.mp-main{flex:1;min-width:0;display:grid;gap:8px}
.mp-head{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.mp-head .mono{font-size:13px}
.mp-meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--dim)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(11,16,38,.4)}
.ach.on{border-color:rgba(255,214,109,.5);background:linear-gradient(160deg,rgba(255,214,109,.1),rgba(155,135,245,.08))}
.medal-wrap{display:block;margin-bottom:4px}
.ach.on .medal-wrap{filter:drop-shadow(0 0 12px rgba(255,214,109,.55))}
.medal{width:54px;height:62px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;background:rgba(155,135,245,.16);color:var(--dim)}
.ach.on .medal{background:linear-gradient(150deg,#FFE7A3,var(--gold) 45%,var(--lavender));color:var(--navy)}
.ach strong{font-size:13.5px;line-height:1.3}
.ach small{font-size:12px;color:var(--muted)}
.ach-rule{font-size:11.5px;color:var(--dim);display:inline-flex;gap:4px;align-items:center;line-height:1.3}
.ach.on .ach-rule{color:var(--gold)}
.unit-art .art-pulse{animation:glowB 3.6s ease-in-out infinite}
.unit-art .art-spin{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
.unit-art .art-scan{animation:artScan 3.4s ease-in-out infinite}
.unit-art .art-flow{stroke-dasharray:5 140;animation:artFlow 2.8s linear infinite}
@keyframes artScan{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
@keyframes artFlow{to{stroke-dashoffset:-145}}

/* ---------- Unit pages ---------- */
.unit-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:26px}
@media (max-width:640px){.unit-hero{grid-template-columns:1fr}}
.unit-hero-art{width:min(300px,100%)}
@media (max-width:640px){.unit-hero-art{order:-1;width:min(260px,100%)}}
.unit-big{font-family:var(--mono);font-size:clamp(54px,9vw,88px);font-weight:700;line-height:.9}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(11,16,38,.45);color:var(--dim);font-size:14px}
.tab[aria-disabled="true"]{cursor:not-allowed}
.plan-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.plan-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.plan-grid{grid-template-columns:1fr}}
.plan-item{padding:18px;border-radius:var(--r-md);border:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;background:rgba(11,16,38,.35)}

/* ---------- Login (Prompt 01) ---------- */
.login-wrap{position:relative;min-height:calc(100vh - var(--nav-h));display:grid;place-items:center;padding-block:28px 40px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 420px at 26% 42%,rgba(155,135,245,.22),transparent 65%),radial-gradient(520px 380px at 80% 70%,rgba(0,229,255,.10),transparent 65%)}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particles i{position:absolute;display:block;border-radius:50%;background:#fff;box-shadow:0 0 8px 1px rgba(155,135,245,.9);opacity:.0;animation:drift linear infinite}
.particles i.c{background:var(--neon);box-shadow:0 0 10px 2px rgba(0,229,255,.8)}
.particles i.g{background:var(--gold);box-shadow:0 0 10px 2px rgba(255,214,109,.7)}
@keyframes drift{0%{transform:translateY(20px) scale(.6);opacity:0}15%{opacity:.9}85%{opacity:.7}100%{transform:translateY(-140px) scale(1);opacity:0}}
.login{position:relative;width:100%;max-width:1080px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.login-hero{display:flex;flex-direction:column;gap:18px;min-width:0}
.holo-stage{position:relative;width:min(440px,100%);aspect-ratio:12/11;max-width:100%}
.holo-stage .net{position:absolute;inset:0;width:100%;height:100%}
.holo-stage .bot-wrap{position:absolute;left:50%;bottom:2%;width:52%;transform:translateX(-50%);filter:drop-shadow(0 18px 30px rgba(0,229,255,.25))}
.net .edge{stroke:rgba(87,204,242,.28);stroke-width:1}
.net .pulse{stroke:var(--neon);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 160;animation:pulse 3.2s linear infinite}
.net .node{fill:var(--cyan);filter:drop-shadow(0 0 4px rgba(0,229,255,.9))}
.net .node.l{fill:var(--lavender);filter:drop-shadow(0 0 4px rgba(155,135,245,.9))}
.net .brain{fill:none;stroke:url(#holoStroke);stroke-width:2.2}
.net .gyri{fill:none;stroke:rgba(155,135,245,.55);stroke-width:1.4;stroke-linecap:round}
.net .scan{animation:scan 4s ease-in-out infinite}
.net .orbit{fill:none;stroke:rgba(155,135,245,.35);stroke-width:1;stroke-dasharray:3 6}
.net .spin{transform-origin:240px 105px;animation:spin 40s linear infinite}
.net .glow-brain{animation:glowB 3.6s ease-in-out infinite}
@keyframes pulse{to{stroke-dashoffset:-166}}
@keyframes scan{0%,100%{transform:translateY(-70px);opacity:0}20%,80%{opacity:.8}50%{transform:translateY(70px)}}
@keyframes glowB{50%{opacity:.65}}
.login-hero h1{font-size:clamp(30px,4.6vw,50px);font-weight:700;letter-spacing:-.01em;line-height:1.12}
.login-hero h1 .w{display:block;font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.login-hero .th1{font-size:clamp(18px,2.2vw,22px);font-weight:600}
.course-chip{display:inline-flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:16px;border:1px solid var(--line);background:rgba(11,16,38,.5);align-self:flex-start}
.course-chip .code{font-family:var(--mono);font-weight:700;font-size:14px;padding:6px 10px;border-radius:10px;color:var(--navy);background:var(--grad)}
.course-chip span{font-size:14px;line-height:1.35}
.course-chip small{display:block;color:var(--muted);font-size:12.5px}
.login-card{position:relative;display:flex;flex-direction:column;gap:18px;padding:30px;animation:cardIn .8s cubic-bezier(.2,.8,.2,1) .15s both;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.85),0 0 0 1px rgba(155,135,245,.12),0 0 60px -20px rgba(155,135,245,.45)}
.login-card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(0,229,255,.7),rgba(155,135,245,.4) 40%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:22px;font-weight:600}
.hint{font-size:12.5px;color:var(--dim)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(11,16,38,.45);cursor:pointer;font-size:13.5px;color:var(--muted)}
.check[data-invalid="true"]{border-color:var(--err)}
.check input{appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border-radius:7px;border:1.5px solid var(--lavender);background:rgba(11,16,38,.6);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--grad);border-color:transparent}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--navy);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.btn-glow{min-height:50px;font-size:16px}
.btn-glow:hover:not(:disabled){box-shadow:0 0 0 1px rgba(0,229,255,.6),0 12px 34px -8px rgba(0,229,255,.95),0 0 40px -6px rgba(155,135,245,.8)}
.limits{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--dim)}
.limits li{display:flex;gap:8px}
.limits li svg{flex:none;margin-top:3px;color:var(--gold)}
.returning{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line-strong);background:linear-gradient(120deg,rgba(155,135,245,.14),rgba(0,229,255,.06))}
.returning .avatar-lg{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--navy);background:var(--grad);box-shadow:0 0 22px -4px rgba(0,229,255,.7)}
.returning strong{display:block;font-size:17px}
.returning span{font-size:13px;color:var(--muted)}
.confirm{display:grid;gap:12px;padding:16px;border-radius:14px;border:1px solid rgba(255,122,144,.45);background:rgba(255,122,144,.07)}
.confirm p{font-size:13.5px;color:#FFD0D7}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 160px}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:10px 0}
.success .bot{width:150px}
.success h2{font-size:24px}
.form-err{display:flex;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,122,144,.5);background:rgba(255,122,144,.08);font-size:13.5px;color:#FFC2CC}
@media (max-width:880px){

}
