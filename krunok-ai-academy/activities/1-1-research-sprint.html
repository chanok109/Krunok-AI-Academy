<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Research & Infographic Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: sticky mission bar (timer) → 5-step stepper → glass workspace + AIra/rubric side column. Single dark world by design. */
:root{
  --navy:#0B1026; --plum:#161336; --lav:#9B87F5; --cyan:#57CCF2; --neon:#00E5FF; --gold:#FFD66D;
  --ink:#F8FAFC; --body:#E2E8F0; --muted:#A3ACC6; --line:rgba(155,135,245,.24); --line2:rgba(87,204,242,.28);
  --glass:rgba(22,19,54,.66); --glass-2:rgba(255,255,255,.035); --field:rgba(11,16,38,.72);
  --ok:#5BE3A8; --bad:#FF8C9E;
  --f-head:'Prompt','Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Sarabun','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--navy)}
body{background:var(--navy);color:var(--body);font-family:var(--f-body);font-size:17.5px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.glow-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 520px at 85% -10%,rgba(155,135,245,.20),transparent 60%),radial-gradient(800px 500px at -10% 30%,rgba(0,229,255,.09),transparent 60%),linear-gradient(180deg,var(--navy),#0E0D2C 70%,var(--navy))}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
h1,h2,h3,h4,.head{font-family:var(--f-head);color:var(--ink);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:clamp(28px,4.4vw,34px);font-weight:700}
h2{font-size:clamp(21px,2.6vw,24px);font-weight:600}
h3{font-size:18.5px;font-weight:600}
p{margin:0}
a{color:var(--cyan)}
.wrap{max-width:1160px;margin:0 auto}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:8px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(11,16,38,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.brand svg{flex:none}
.brand b{font-family:var(--f-head);font-weight:600;color:var(--ink);font-size:15.5px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:13px;line-height:1.2;display:block}
.spacer{flex:1}
.timer{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-size:13.5px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass-2);min-width:0}
.timer .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);font-size:16px;white-space:nowrap}
.timer .ph{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .bar{width:120px;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;gap:2px}
.timer .bar i{display:block;height:100%;background:rgba(255,255,255,.10);position:relative;overflow:hidden}
.timer .bar i b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan),var(--lav))}
.timer.over{border-color:rgba(255,214,109,.5)}
.timer.over .t{color:var(--gold)}
.saved{font-size:12.5px;color:var(--muted);font-family:var(--f-head);white-space:nowrap}
@media (max-width:640px){.timer .bar,.saved{display:none}.timer{flex:1}.brand small{display:none}}

/* hero (home) */
.home-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;padding:38px 0 18px}
@media (max-width:860px){.home-hero{grid-template-columns:minmax(0,1fr);padding-top:24px}}
.eyebrow{font-family:var(--f-head);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.home-hero h1{font-size:clamp(32px,5.6vw,52px);line-height:1.12;margin:8px 0 12px;letter-spacing:-.01em}
.home-hero h1 span{background:linear-gradient(90deg,var(--lav),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:19px;color:var(--body);max-width:40ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--glass-2)}
.stat b{display:block;font-family:var(--f-head);font-size:30px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:14px;color:var(--muted);font-family:var(--f-head)}
.btn-start{font-size:20px!important;padding:16px 34px!important;border-radius:16px!important}
.stage-art{position:relative;display:grid;place-items:center;min-height:300px}
.stage-art .brain{width:min(340px,100%);height:auto}
.stage-art .aira-big{position:absolute;right:4%;bottom:0;width:110px;height:124px}
@media (max-width:860px){.stage-art{min-height:220px}.stage-art .brain{width:260px}}
.privacy{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:22px 0 22px;padding:0;list-style:none}
.stepper li{position:relative}
.stepper li:not(:last-child)::after{content:"";position:absolute;top:24px;left:calc(50% + 24px);right:calc(-50% + 24px);height:1.5px;background:var(--line)}
.stepper li.done:not(:last-child)::after{background:rgba(91,227,168,.45)}
.stepper a{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 2px;border-radius:12px;text-decoration:none}
.stepper .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:15px;border:1.5px solid var(--line);color:var(--muted);background:var(--field)}
.stepper .lbl{font-family:var(--f-head);font-size:13.5px;line-height:1.3;color:var(--muted)}
.stepper .min{font-family:var(--f-head);font-size:11.5px;color:#6F789A}
.stepper .done .dot{border-color:var(--ok);color:var(--ok)}
.stepper .cur .dot{border-color:var(--neon);color:var(--navy);background:var(--neon);box-shadow:0 0 18px rgba(0,229,255,.55)}
.stepper .cur .lbl{color:var(--ink)}
.stepper .locked a{opacity:.42;cursor:not-allowed}
@media (max-width:700px){.stepper .lbl,.stepper .min{display:none}.stepper .dot{width:34px;height:34px}.stepper li:not(:last-child)::after{top:23px;left:calc(50% + 20px);right:calc(-50% + 20px)}}
.steptitle{display:none;font-family:var(--f-head);color:var(--ink);font-size:15px;margin:-12px 0 16px;text-align:center}
@media (max-width:700px){.steptitle{display:block}}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
@media (max-width:520px){.card{padding:18px}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
@media (max-width:700px){.cols2,.cols3{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:1.65}
.note{border:1px dashed rgba(255,214,109,.45);background:rgba(255,214,109,.06);color:var(--body);border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.65}
.note b{color:var(--gold);font-family:var(--f-head);font-weight:600}
.note.cy{border-color:var(--line2);background:rgba(0,229,255,.05)}
.note.cy b{color:var(--neon)}

/* fields */
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label.f > span,.flabel{font-family:var(--f-head);font-size:15px;color:var(--ink);font-weight:500}
label.f > span em,.flabel em{font-style:normal;color:var(--muted);font-weight:400;font-size:13.5px}
input[type=text],input[type=url],input[type=number],select,textarea{font:inherit;font-size:16.5px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:100%;line-height:1.65}
textarea{resize:vertical;min-height:92px}
input::placeholder,textarea::placeholder{color:#6F789A}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.counter{font-family:var(--f-head);font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* buttons */
.btn{font-family:var(--f-head);font-size:15.5px;font-weight:500;border-radius:12px;padding:10px 18px;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);cursor:pointer;transition:box-shadow .2s,border-color .2s,transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.3;text-decoration:none}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(87,204,242,.25)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--lav),var(--cyan));color:#0B1026;border-color:transparent;font-weight:600}
.btn.primary:hover{box-shadow:0 0 24px rgba(0,229,255,.45)}
.btn.gold{background:var(--gold);color:#1a1530;border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,140,158,.45);color:var(--bad);background:transparent}
.btn.sm{font-size:14px;padding:6px 12px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}
.foot-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}

/* AIra + side */
.side{position:sticky;top:92px;display:flex;flex-direction:column;gap:16px}
@media (max-width:1000px){.side{position:static}}
.aira-card{display:flex;gap:12px;align-items:flex-start}
.aira-card svg{flex:none;width:70px;height:80px}
.bubble{background:rgba(155,135,245,.12);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15.5px;line-height:1.7;color:var(--body);min-width:0}
.bubble b{color:var(--ink);font-family:var(--f-head);font-weight:600}
ul.clean{list-style:none;margin:0;padding:0}
.plan li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(155,135,245,.15);font-size:15px}
.plan li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-family:var(--f-head);font-size:13.5px;white-space:nowrap}
.plan li.now span:first-child{color:var(--neon);font-weight:600}

/* rubric */
.rub-group{display:flex;flex-direction:column;gap:2px}
.rub-group h4{font-size:15.5px;display:flex;justify-content:space-between;color:var(--ink);padding-bottom:4px;border-bottom:1px solid var(--line)}
.rub-group h4 span{color:var(--neon);font-variant-numeric:tabular-nums}
.rub-row{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;line-height:1.55;padding:5px 0}
.rub-row b{font-family:var(--f-head);color:var(--body);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.rub-row small{display:block;color:var(--muted);font-size:13px}
.fab{background:var(--plum)!important;border-color:var(--line2)!important;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.drawer-bg{position:fixed;inset:0;background:rgba(5,8,20,.6);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:46;background:var(--plum);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px}
.drawer.on{transform:none}.drawer-bg.on{opacity:1;pointer-events:auto}

/* topic */
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.topics{grid-template-columns:minmax(0,1fr)}}
.tcard{position:relative;border-radius:16px;padding:16px 18px;border:1.5px solid var(--line);background:var(--glass-2);overflow:hidden;min-width:0;transition:opacity .3s,border-color .3s,box-shadow .3s}
.tcard::before{content:"";position:absolute;right:-50px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:var(--tc);opacity:.12;filter:blur(8px)}
.tcard .code{font-family:var(--f-head);font-size:12.5px;letter-spacing:.08em;color:var(--tc)}
.tcard h3{font-size:18px;margin:2px 0 6px}
.tcard ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.tcard.win{border-color:var(--tc);box-shadow:0 0 30px color-mix(in srgb,var(--tc) 45%,transparent)}
.tcard.dim{opacity:.38}
.deck{display:flex;justify-content:center;gap:16px;padding:18px 0 6px;perspective:900px;min-height:170px}
.mini{width:104px;height:146px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.mini .face,.mini .backf{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px}
.mini .backf{background:linear-gradient(145deg,#1d1946,#0f1433);border:1.5px solid var(--line);background-image:radial-gradient(circle at 50% 50%,rgba(0,229,255,.18) 0 18px,transparent 19px),repeating-linear-gradient(45deg,rgba(155,135,245,.12) 0 6px,transparent 6px 12px)}
.mini .backf span{font-family:var(--f-head);font-weight:700;font-size:26px;color:var(--neon)}
.mini .face{transform:rotateY(180deg);background:var(--plum);border:1.5px solid var(--tc,var(--line))}
.mini .face b{font-family:var(--f-head);font-size:13px;color:var(--tc);letter-spacing:.06em}
.mini .face i{font-style:normal;font-family:var(--f-head);font-size:14px;color:var(--ink);line-height:1.3}
.mini.open{transform:rotateY(180deg)}
.mini.win .face{box-shadow:0 0 30px color-mix(in srgb,var(--tc) 60%,transparent)}
.mini.lose{opacity:.35}
.deck.shuffle .mini:nth-child(1){animation:shA 1.5s ease-in-out}
.deck.shuffle .mini:nth-child(2){animation:shB 1.5s ease-in-out}
.deck.shuffle .mini:nth-child(3){animation:shC 1.5s ease-in-out}
@keyframes shA{0%,100%{transform:none}20%{transform:translate(120px,-14px) rotate(6deg)}45%{transform:translate(240px,0) rotate(-4deg)}70%{transform:translate(120px,12px) rotate(3deg)}}
@keyframes shB{0%,100%{transform:none}20%{transform:translate(-120px,12px) rotate(-6deg)}45%{transform:translate(0,-18px) rotate(5deg)}70%{transform:translate(120px,0) rotate(-3deg)}}
@keyframes shC{0%,100%{transform:none}20%{transform:translate(0,16px) rotate(4deg)}45%{transform:translate(-240px,0) rotate(-5deg)}70%{transform:translate(-120px,-12px) rotate(4deg)}}
@media (max-width:420px){.mini{width:88px;height:126px}.deck{gap:10px}}
.congrats{text-align:center}
.congrats h2{font-size:clamp(22px,3vw,27px)}
.congrats h2 span{color:var(--neon)}

/* research */
.point{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--glass-2)}
.point-h{display:flex;gap:10px;align-items:flex-start}
.point-h .n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-head);font-size:13px;background:rgba(155,135,245,.18);color:var(--ink)}
.point-h .n.ok{background:rgba(91,227,168,.2);color:var(--ok)}
.point-h h4{font-size:16.5px;font-weight:600}
.point-h p{font-size:14.5px;color:var(--muted);line-height:1.6}
.point textarea{margin-top:10px;min-height:84px}
.qlist{margin:0;padding-left:20px;font-size:16px}
.src{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--glass-2)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px}
.checks.col{flex-direction:column;gap:10px}
.checks label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;line-height:1.55}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--neon);flex:none;margin-top:3px}
.badge{font-family:var(--f-head);font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.badge.ok{border-color:rgba(91,227,168,.5);color:var(--ok)}
.badge.warn{border-color:rgba(255,214,109,.5);color:var(--gold)}
.badge.bad{border-color:rgba(255,140,158,.5);color:var(--bad)}
.links{display:flex;flex-direction:column;gap:8px;font-size:15px}
.links a{text-decoration:none;display:block;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass-2)}
.links a:hover{border-color:var(--cyan)}
.links a small{display:block;color:var(--muted);font-size:13px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw code{font-family:var(--f-body);font-size:14px;background:rgba(87,204,242,.1);border:1px solid var(--line2);color:var(--cyan);border-radius:8px;padding:1px 8px}

/* report + A4 */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:22px;align-items:start}
@media (max-width:1020px){.split{grid-template-columns:minmax(0,1fr)}}
.a4-side{position:sticky;top:92px}
@media (max-width:1020px){.a4-side{position:static}}
.a4-frame{position:relative;width:100%;overflow:hidden;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.45);background:#fff}
.a4{position:absolute;left:0;top:0;width:794px;height:1123px;background:#fff;color:#1d1f2b;transform-origin:0 0;overflow:hidden}
.a4-flow{padding:68px 76px 60px;font-family:'Sarabun','Loma',serif;font-size:16px;line-height:1.6;color:#1d1f2b}
.a4-flow .meta{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:#4b4f63;border-bottom:1px solid #d9dbe6;padding-bottom:6px;margin-bottom:10px}
.a4-flow h1{font-family:'Sarabun','Loma',serif;color:#111;text-align:center;font-size:22px;font-weight:700;margin:0 0 4px;line-height:1.35;text-wrap:wrap}
.a4-flow .by{text-align:center;font-size:14.5px;color:#3a3e52;margin-bottom:8px}
.a4-flow h2{font-family:'Sarabun','Loma',serif;color:#1b1650;font-size:16.5px;font-weight:700;margin:9px 0 1px;line-height:1.4;text-wrap:wrap}
.a4-flow h3{font-family:'Sarabun','Loma',serif;color:#222;font-size:16px;font-weight:600;margin:4px 0 0;line-height:1.45;text-wrap:wrap}
.a4-flow p{margin:0 0 3px;text-indent:2em}
.a4-flow .refs p{text-indent:-2em;padding-left:2em;font-size:14.5px}
.a4-flow .ph{color:#a2a6b8}
.a4-cut{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(135deg,#ff8c9e 0 8px,#ffd0d7 8px 16px);display:none;align-items:center;justify-content:center;font:600 13px var(--f-head);color:#5a0b18}
.a4-frame.over .a4-cut{display:flex}
.meter{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lav));transition:width .3s}
.meter.over i{background:var(--bad)}
.full-preview{max-width:720px;margin:0 auto}
#pdfstage{position:absolute;left:-12000px;top:0;width:794px;height:1123px;overflow:hidden;background:#fff}

/* poster */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font-family:var(--f-head);font-size:14px;border:1px solid var(--line);background:var(--glass-2);color:var(--body);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{border-color:var(--neon);color:var(--navy);background:var(--neon)}
.sw{display:inline-flex;gap:2px}.sw i{width:11px;height:11px;border-radius:3px;display:block}
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;background:rgba(0,229,255,.03);cursor:pointer;transition:border-color .2s,background .2s}
.drop.on,.drop:hover{border-color:var(--neon);background:rgba(0,229,255,.07)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.poster-frame{width:100%;aspect-ratio:210/297;max-width:100%;border-radius:6px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px),var(--field);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.poster-frame img,.poster-frame canvas{width:100%;height:100%;object-fit:contain;display:block}
.poster-empty{color:var(--muted);text-align:center;padding:20px;font-size:15px}
.filecard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--glass-2);font-size:14.5px;min-width:0}
.filecard b{font-family:var(--f-head);font-weight:500;color:var(--ink);overflow-wrap:anywhere}
pre.prompt{white-space:pre-wrap;word-break:break-word}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tools a{display:flex;flex-direction:column;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-family:var(--f-head);font-size:14.5px;background:var(--glass-2)}
.tools a small{color:var(--muted);font-family:var(--f-body);font-size:13px}
.tools a:hover{border-color:var(--cyan)}

/* review */
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:700px){.works{grid-template-columns:minmax(0,1fr)}}
.work{display:flex;flex-direction:column;gap:12px;min-width:0}
.work .thumb{max-width:300px;width:100%;margin:0 auto}
.reqs li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed rgba(155,135,245,.15);font-size:15.5px;line-height:1.55}
.reqs label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
.reqs .hint{font-size:13px;font-family:var(--f-head);white-space:nowrap}
.ready{text-align:center;padding:6px 0}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--plum);border:1px solid var(--line2);color:var(--ink);font-family:var(--f-head);font-size:15px;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.brain .nd{animation:pulse 2.6s ease-in-out infinite}
.blink{animation:pulse 3.2s ease-in-out infinite}
.aira-big{animation:floaty 4s ease-in-out infinite}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function renderPdfPreviews(){const m=S.posterMeta;if(!m||m.type!=='application/pdf'||!posterBlob)return;const cvs=[...document.querySelectorAll('#pdfcanvas,[data-pdfcanvas]')];if(!cvs.length)return;
 try{const lib=await pdfjs();const buf=await posterBlob.arrayBuffer();const doc=await lib.getDocument({data:buf,isEvalSupported:false}).promise;const page=await doc.getPage(1);
  const vp0=page.getViewport({scale:1});
  for(const c of cvs){const vp=page.getViewport({scale:Math.min(2,900/vp0.height)});c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;c.hidden=false;const ph=c.parentElement.querySelector('.poster-empty');if(ph)ph.remove()}
  if(!m.w){m.w=Math.round(vp0.width);m.h=Math.round(vp0.height);save()}}

async function takeFile(f){const okType=/^(image\/(png|jpeg)|application\/pdf)$/.test(f.type)||/\.(png|jpe?g|pdf)$/i.test(f.name);
 if(!okType){toast('รองรับเฉพาะไฟล์ PNG, JPG หรือ PDF',3000);return}if(f.size>20*1048576){toast('ไฟล์ใหญ่เกิน 20 MB ให้ลดขนาดก่อน',3000);return}
 const type=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':/\.png$/i.test(f.name)?'image/png':'image/jpeg');
 const blob=f.slice(0,f.size,type);const meta={name:f.name,type,size:f.size,at:Date.now()};
 if(type!=='application/pdf'){try{const bm=await createImageBitmap(blob);meta.w=bm.width;meta.h=bm.height;bm.close&&bm.close()}catch(e){}}
 const ok=await IDB.put('poster',blob);posterBlob=blob;posterURL&&URL.revokeObjectURL(posterURL);posterURL=URL.createObjectURL(blob);
 S.posterMeta=meta;S.dl.poster=null;save(true);render();toast(ok?'อัปโหลดโปสเตอร์แล้ว':'แสดงโปสเตอร์ได้ แต่บันทึกในเบราว์เซอร์นี้ไม่ได้ ถ้าปิดหน้าต้องอัปโหลดใหม่',3600)}

  S.report.content=T().points.map((p,i)=>`# ${p.t}\n${(S.research.notes[i]||'').trim()}`).join('\n');if(!S.report.summary.trim())S.report.summary=S.research.summary;save(true);render();toast('นำโน้ตมาเป็นโครงแล้ว เรียบเรียงต่อเป็นย่อหน้า',3000)}

 else if(act==='pullpoints'){const heads=S.report.content.split('\n').filter(l=>l.trim().startsWith('#')).map(l=>l.replace(/^#+\s*/,'').trim()).slice(0,5);

 else if(act==='genprompt'){S.poster.prompt=buildPrompt();save(true);const t=$('#p-prompt');if(t)t.value=S.poster.prompt;toast('สร้าง Prompt แล้ว แก้ไขต่อได้')}

 else if(act==='delposter')arm(a,'กดอีกครั้งเพื่อลบ',async()=>{await IDB.del('poster');posterBlob=null;posterURL&&URL.revokeObjectURL(posterURL);posterURL=null;S.posterMeta=null;S.dl.poster=null;save(true);render()});

 else if(act==='dlboth'){if(!reportFill().fits){toast('รายงานเกิน 1 หน้า แก้ไขก่อนดาวน์โหลด',3000);return}await downloadReport(a);if(posterBlob)setTimeout(()=>{const b=document.querySelector('[data-act="dlposter"]');if(b)downloadPoster(b)},400);else toast('ยังไม่มีโปสเตอร์ให้ดาวน์โหลด',3000)}

/* ================= FX ================= */
(function particles(){const c=$('#particles');const x=c.getContext('2d');let W,H,P=[];const dpr=Math.min(2,devicePixelRatio||1);
 function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);
  P=Array.from({length:Math.round(Math.min(44,W*H/26000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,vx:(Math.random()-.5)*.14,vy:-Math.random()*.18-.03,c:Math.random()<.6?'0,229,255':'155,135,245',a:Math.random()*.5+.15}))}
 function drawP(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
  x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle=`rgba(${p.c},${p.a})`;x.fill()});if(!reduce&&!document.hidden)requestAnimationFrame(drawP)}
 size();addEventListener('resize',size);drawP();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!reduce)drawP()});})();
function confetti(n){if(reduce)return;const c=$('#confetti');const x=c.getContext('2d');const W=innerWidth,H=innerHeight;c.width=W;c.height=H;
 const cols=['#9B87F5','#57CCF2','#00E5FF','#FFD66D','#F8FAFC'];const P=Array.from({length:n||140},()=>({x:W/2+(Math.random()-.5)*120,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[rnd(cols.length)]}));
 const t0=performance.now();(function f(t){x.clearRect(0,0,W,H);const k=(t-t0)/2600;P.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-k);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
 if(k<1)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})(t0);}
